    note: "AG-1533 - remove once #16624 is backported to next/3.12.x.x"
    branches:
      - "next/3.12.x.x"
  - name: "ai-proxy-advanced-restful-azure"
    reason: "AssertionError: Background Entity ID should be present: expected undefined to exist"
    owner: "vincenzo.gasparo@konghq.com"
    branches:
      - "release/3.14.*"
      - "next/3.14.*"
      - "release/3.14.0.18^" # PRs into release/3.14.0.18, matched by PR base ref (kong-ee #25269)
  # The guardrail suites from before kong-ee #24163 still run on these branches; the other three
  # entries below reuse this entry's reason, note and branches.
  - name: "ai-azure-content-safety-native"
    reason: &pre_24163_guardrails_reason "aigw-next/2.3.x, the aigw-release/2.2.* and 2.3 release lines and the 3.x lines cut before the guardrail mirror still run the guardrail suites from before kong-ee #24163. The mirrored suites pass with no skip list on aigw-master: https://github.com/Kong/kong-ee/actions/runs/42832787719 and master: https://github.com/Kong/kong-ee/actions/runs/42837860409. aigw-next/2.2.x carries them since kong-ee #24840."
    owner: "vincenzo.gasparo@konghq.com"
    note: &pre_24163_guardrails_note "Drop the 2.3 line once #24163 is backported to aigw-next/2.3.x (kong-ee #24872)."
    branches: &pre_24163_guardrails_branches
      - "*aigw*release*2.2.*" # aigw-release/2.2.* and PRs into them named after the release (kong-ee #24123, #25574)
      - "aigw-2.2.*" # aigw-2.2.* tags
      - "*aigw*2.3.*" # aigw-next/2.3.x, aigw-release/2.3.*, aigw-2.3.* tags and PRs into 2.3.x
      - "next/3.12.*"
      - "next/3.12.x.x^" # PRs into next/3.12.x.x, once its filter matches by PR base ref
      - "next/3.13.*"
      - "next/3.13.x.x^" # PRs into next/3.13.x.x, matched by PR base ref (kong-ee #24977)
      - "next/3.1*.0.*" # 3.14-3.16 patch branches, cut before kong-ee #24692-#24694
      - "release/3.1*" # every 3.x release, also the mirrored 3.14.0.18+ and 3.15.0.8+; next/3.14-3.16.x.x and PRs into releases still run the specs
      - "release/3.13.0.14^" # PRs into release/3.13.0.14, matched by PR base ref (kong-ee #25393)
      - "release/3.16.0.4^" # PRs into release/3.16.0.4, matched by PR base ref (kong-ee #25394)
  - name: "ai-azure-content-safety-custom-guardrail"
    reason: *pre_24163_guardrails_reason
    owner: "vincenzo.gasparo@konghq.com"
    note: *pre_24163_guardrails_note
    branches: *pre_24163_guardrails_branches
  - name: "ai-lakera-guard"
    reason: *pre_24163_guardrails_reason
    owner: "vincenzo.gasparo@konghq.com"
    note: *pre_24163_guardrails_note
    branches: *pre_24163_guardrails_branches
  - name: "ai-gcp-model-armor"
    reason: *pre_24163_guardrails_reason
    owner: "vincenzo.gasparo@konghq.com"
    note: *pre_24163_guardrails_note
    branches: *pre_24163_guardrails_branches
  - name: "ai-guardrail-gemini-llm-format"
    reason: "AG-1770: the ai-aws-guardrails masking case returns 400 'at least one contents field is required' on the 2.2 releases, which lack kong-ee #22745 (mask the in-use body): https://github.com/Kong/kong-ee/actions/runs/45364325669/job/138906584328"
    owner: "michael.xiong@konghq.com"
    note: "#22745 is not backported to the 2.2 releases. Drop this entry when no 2.2 release gets patches."
    branches:
      - "*aigw*release*2.2.*" # aigw-release/2.2.* and PRs such as chore/aigw-release-2.2.3-cherry-picks. aigw-next/2.2.x has the fix.
      - "aigw-2.2.3*" # tag runs: aigw-2.2.3-rc.* and aigw-2.2.3. A tag run has no head ref, so the filter matches the tag name.

