    owner: "liangwen.chen@konghq.com"
  # AG-1798: the OUTPUT guard scans the raw provider envelope, so pi_and_jailbreak never matches
  - name: "ai-gcp-model-armor"
    reason: "streaming OUTPUT block is a race between the guardrail verdict and stream delivery, nondeterministic until fixed, see https://konghq.atlassian.net/browse/AG-1713. Buffered OUTPUT prompt-injection blocking never fires either: https://konghq.atlassian.net/browse/AG-1798"
    owner: "vincenzo.gasparo@konghq.com"
    note: "AG-1713 and AG-1798 - un-skip once both are fixed"
  - name: "ai-proxy-advanced-restful-gemini-vertex"
    reason: "Gemini Vertex batchPredictionJobs sit in JOB_STATE_PENDING in the gcp-sdet-test project: the cancel returns 200 but the state never becomes terminal, so the batches delete step is rejected by GCP with 400 FAILED_PRECONDITION. Same condition kong-ee PR #22730 worked around for the native-format spec"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once Vertex batch jobs settle again; the spec skips its own delete step while the job stays PENDING"
  - name: "ai-proxy-advanced-anthropic-streaming"
    reason: "bedrock target (global.anthropic.claude-sonnet-5) streams a `thinking` content block first, so the spec's assertion that the first content_block_start is `text` fails: https://github.com/Kong/kong-ee/actions/runs/36690746674"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once the spec tolerates a leading thinking block on models that reason by default"
  - name: "ai-proxy-advanced-chat-reasoning-gemini-vertex"
    reason: "gemini-vertex (gemini-3-flash-preview) returns 400 on replayed function-call history, 'function call `get_weather` in the 2. content block is missing a `thought_signature`', failing the tool-call follow-up and sequential multi-tool-call tests: https://github.com/Kong/kong-ee/actions/runs/36690746674"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once the gemini-vertex path attaches a thought_signature to function calls it replays"
  - name: "ai-proxy-advanced-structured-output-anthropic"
    reason: "Claude Opus 5.5 / Sonnet 5.5 / Fable 5.1 reject the forced tool_choice Kong sends for structured output, failing all 7 cases with 400: tool_choice types tool and any are not supported for this model. https://konghq.atlassian.net/browse/AG-1994"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once the anthropic driver stops forcing tool_choice on models that only accept auto and none"
  - name: "ai-proxy-advanced-anthropic-reasoning-anthropic"
    reason: "Sonnet 5.5 rejects thinking.type enabled (needs adaptive plus output_config.effort) and thinking.type disabled (needs between_tools), and returns no thinking text where the spec asserts some. Gateway side of the change is PR #22765 (AG-1729): https://github.com/Kong/kong-ee/actions/runs/38563275348"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once #22765 lands and this spec sends the 5.x thinking shapes"
  - name: "ai-proxy-advanced-anthropic-reasoning-bedrock-inference-profile"
    reason: "Same condition as the direct Anthropic entry, on us.anthropic.claude-sonnet-5-5 over the Bedrock inference profile: thinking type changes and signature-only thinking blocks. Gateway side of the change is PR #22765 (AG-1729)"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once #22765 lands and this spec sends the 5.x thinking shapes"
  - name: "ai-proxy-advanced-chat-reasoning-anthropic"
    reason: "Sonnet 5.5 does not surface thinking text unless the request asks for it, so the expose-reasoning assertion reads an empty string. Gateway side of the change is PR #22765 (AG-1729)"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once #22765 lands and this spec tolerates a model that omits thinking text"
  - name: "ai-proxy-advanced-chat-reasoning-gemini-vertex-passthrough"
    reason: "Same empty-thinking-text condition on the Vertex Claude 5.5 leg, served from the global endpoint. Gateway side of the change is PR #22765 (AG-1729)"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once #22765 lands and this spec tolerates a model that omits thinking text"
  - name: "ai-proxy-advanced-chat-reasoning-azure-foundry"
    reason: "Foundry Sonnet 5.5 answers 408 on the reasoning requests and omits the thinking text the spec asserts. Gateway side of the change is PR #22765 (AG-1729)"
    owner: "vincenzo.gasparo@konghq.com"
    note: "un-skip once #22765 lands and the Foundry deployment serves the reasoning legs"

